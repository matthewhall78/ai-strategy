<!--
Reusable Site Navigation Snippet

How to use on a new page:
1) Copy this entire block.
2) Paste the STYLE BLOCK into your page head.
3) Paste the NAV BLOCK as the first element inside body.
4) Preserve the .site-nav-track wrapper and semantic nav-* link classes.
5) Add active only to the current page link.
-->

<!-- STYLE BLOCK: paste inside <head> -->
<style>
  .site-nav {
    --site-nav-bg: rgba(8, 13, 18, .78);
    --site-nav-border: rgba(255, 255, 255, .14);
    --site-nav-link: #d8e7f1;
    --site-nav-hover-bg: rgba(56, 189, 248, .18);
    --site-nav-hover-border: rgba(56, 189, 248, .4);
    --site-nav-active-bg: rgba(34, 197, 94, .2);
    --site-nav-active-border: rgba(34, 197, 94, .56);
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    max-width: calc(100vw - 28px);
    padding: 10px;
    border: 1px solid var(--site-nav-border);
    border-radius: 999px;
    background: var(--site-nav-bg);
    backdrop-filter: blur(7px);
    box-shadow: 0 12px 34px rgba(0, 0, 0, .34);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .site-nav-track {
    display: flex;
    gap: 10px;
    flex-wrap: nowrap;
    justify-content: flex-start;
    min-width: max-content;
  }

  .site-nav a {
    flex: 0 0 auto;
    white-space: nowrap;
    color: var(--site-nav-link);
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .02em;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: background .22s ease, border-color .22s ease, color .22s ease;
  }

  .site-nav a:hover,
  .site-nav a:focus-visible {
    color: #ffffff;
    background: var(--site-nav-hover-bg);
    border-color: var(--site-nav-hover-border);
    outline: none;
  }

  .site-nav a.active {
    color: #ffffff;
    background: var(--site-nav-active-bg);
    border-color: var(--site-nav-active-border);
  }

  .site-nav::-webkit-scrollbar {
    display: none;
  }

  @media (max-width: 980px) {
    .site-nav {
      left: 14px;
      right: 14px;
      transform: none;
      border-radius: 18px;
    }
  }
</style>

<!-- NAV BLOCK: paste as first element inside <body> -->
<!-- Example: <body data-page="context"> -->
<nav class="site-nav" aria-label="Site navigation">
  <div class="site-nav-track">
    <a class="nav-overview" href="index.html">Overview</a>
    <a class="nav-ladder" href="agentic-maturity-ladder.html">Maturity Ladder</a>
    <a class="nav-context" href="context-engineering-primitives.html">Context Primitives</a>
    <a class="nav-intent" href="human-intent-agent-execution.html">Intent to Execution</a>
    <a class="nav-apm" href="apm-overview.html">APM Overview</a>
    <a class="nav-coding-agent" href="github-copilot-coding-agent.html">Coding Agent</a>
    <a class="nav-continuous-improvement" href="continuous-improvement-copilot-workflow.html">Continuous Improvement</a>
    <a class="nav-modernization" href="github-copilot-modernization-getting-started.html">Modernization Guide</a>
    <a class="nav-metrics" href="metrics-dashboard.html">Metrics Dashboard</a>
  </div>
</nav>
