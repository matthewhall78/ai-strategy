<!--
Reusable Site Navigation Snippet — Restructured with Topics Dropdown

How to use on a new page:
1) Copy this entire block.
2) Paste the STYLE BLOCK into your page head.
3) Paste the NAV BLOCK as the first element inside body.
4) Add the correct active class to your current page's nav link (nav-home, nav-topics, nav-metrics, nav-docs).
5) On content pages (not index.html), add data-category="{category-slug}" to <body> tag.

Available categories (for Topics dropdown and URL filters):
- pattern (Patterns)
- operating-model (Operating Model)
- worked-example (Worked Examples)
- quickstart (Quickstarts)
- reference-tool (Reference/Tools)
-->

<!-- STYLE BLOCK: paste inside <head> -->
<style>
  .site-nav {
    --site-nav-bg: rgba(8, 13, 18, .78);
    --site-nav-border: rgba(255, 255, 255, .14);
    --site-nav-link: #d8e7f1;
    --site-nav-hover-bg: rgba(56, 189, 248, .18);
    --site-nav-hover-border: rgba(56, 189, 248, .4);
    --site-nav-active-bg: rgba(34, 197, 94, .2);
    --site-nav-active-border: rgba(34, 197, 94, .56);
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    max-width: calc(100vw - 28px);
    padding: 10px;
    border: 1px solid var(--site-nav-border);
    border-radius: 999px;
    background: var(--site-nav-bg);
    backdrop-filter: blur(7px);
    box-shadow: 0 12px 34px rgba(0, 0, 0, .34);
    overflow: visible;
  }

  .site-nav-track {
    display: flex;
    gap: 10px;
    flex-wrap: nowrap;
    justify-content: flex-start;
    min-width: max-content;
    align-items: center;
      overflow: visible;
  }

  .site-nav a, .site-nav-dropdown-trigger {
    flex: 0 0 auto;
    white-space: nowrap;
    color: var(--site-nav-link);
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .02em;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    transition: background .22s ease, border-color .22s ease, color .22s ease;
    cursor: pointer;
    background: none;
    font-family: inherit;
  }

  .site-nav a:hover,
  .site-nav a:focus-visible,
  .site-nav-dropdown-trigger:hover,
  .site-nav-dropdown-trigger:focus-visible {
    color: #ffffff;
    background: var(--site-nav-hover-bg);
    border-color: var(--site-nav-hover-border);
    outline: none;
  }

  .site-nav a.active,
  .site-nav-dropdown-trigger.active {
    color: #ffffff;
    background: var(--site-nav-active-bg);
    border-color: var(--site-nav-active-border);
  }

  .site-nav-dropdown {
    position: relative;
    display: flex;
    align-items: center;
  }

  .site-nav-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    background: var(--site-nav-bg);
    border: 1px solid var(--site-nav-border);
    border-radius: 12px;
    padding: 8px;
    min-width: 160px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
    display: flex;
    flex-direction: column;
    gap: 4px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: opacity .22s ease, visibility .22s ease, transform .22s ease;
    z-index: 40;
    backdrop-filter: blur(7px);
  }

  .site-nav-dropdown:hover .site-nav-dropdown-menu,
  .site-nav-dropdown:focus-within .site-nav-dropdown-menu,
  .site-nav-dropdown-trigger[aria-expanded="true"] ~ .site-nav-dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .site-nav-dropdown-menu a {
    padding: 8px 12px;
    border-radius: 8px;
    margin: 0;
    transition: background .22s ease;
  }

  .site-nav-dropdown-menu a:hover {
    background: var(--site-nav-hover-bg);
  }

  .site-nav-track::-webkit-scrollbar {
    display: none;
  }

  @media (max-width: 980px) {
    .site-nav {
      left: 14px;
      right: 14px;
      transform: none;
      border-radius: 18px;
    }

    .site-nav-dropdown-menu {
      top: calc(100% + 4px);
    }
  }
</style>

<!-- NAV BLOCK: paste as first element inside <body> -->
<nav class="site-nav" aria-label="Site navigation">
  <div class="site-nav-track">
    <a class="nav-home" href="index.html">Home</a>
    
    <div class="site-nav-dropdown">
      <button class="site-nav-dropdown-trigger nav-topics" aria-label="Browse topics by category" aria-expanded="false">Topics</button>
      <div class="site-nav-dropdown-menu">
        <a href="index.html?category=pattern">Patterns</a>
        <a href="index.html?category=operating-model">Operating Model</a>
        <a href="index.html?category=worked-example">Worked Examples</a>
        <a href="index.html?category=quickstart">Quickstarts</a>
        <a href="index.html?category=reference-tool">Reference/Tools</a>
      </div>
    </div>
    
    <a class="nav-metrics" href="metrics-dashboard.html">Metrics</a>
    <a class="nav-docs" href="https://github.com/mahall-bc/AI-Website" target="_blank" rel="noopener noreferrer">Docs</a>
  </div>
</nav>

<!-- ACTIVE LINK CLASSES -->
<!-- On index.html: class="nav-home active" -->
<!-- On agentic-maturity-ladder.html: class="nav-home" (Topics may show as active if filtering) -->
<!-- On metrics-dashboard.html: class="nav-metrics active" -->
<!-- On all pages: Topics remains without active (dropdown) -->
<!-- Use data-category on all content pages: <body data-category="pattern"> -->

<script>
  // Simple dropdown toggle for mobile/touch devices
  document.addEventListener('DOMContentLoaded', function() {
    const dropdownTrigger = document.querySelector('.site-nav-dropdown-trigger');
    if (!dropdownTrigger) return;
    
    dropdownTrigger.addEventListener('click', function(e) {
      const isExpanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', !isExpanded);
    });

    // Close dropdown when a category is clicked
    document.querySelectorAll('.site-nav-dropdown-menu a').forEach(link => {
      link.addEventListener('click', function() {
        dropdownTrigger.setAttribute('aria-expanded', 'false');
      });
    });
  });
</script>
